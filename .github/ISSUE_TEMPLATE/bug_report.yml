name: 缺陷报告
description: 报告可以稳定复现的 OpenMontage 问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交缺陷。请填写以下信息，帮助维护者快速复现和定位问题。
        如果只是咨询或寻求使用帮助，请前往 [GitHub Discussions](https://github.com/calesthio/OpenMontage/discussions)。
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 请用一段话清楚描述问题。
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11、macOS 14.5、Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: pipeline
    attributes:
      label: Pipeline（流水线）
      description: 出现问题时正在运行哪个 pipeline？如果不涉及可留空。
      placeholder: 例如 cinematic、explainer、character-animation
    validations:
      required: false
  - type: input
    id: runtime
    attributes:
      label: 合成引擎 / renderer
      placeholder: 例如 remotion、hyperframes
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 请列出能够触发问题的准确命令或操作。
      placeholder: |
        1. 运行 `...`
        2. ...
        3. 出现错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或错误输出
      description: 请粘贴错误消息或 traceback；内容会自动按代码格式显示。请先移除 API 密钥等敏感信息。
      render: shell
    validations:
      required: false
