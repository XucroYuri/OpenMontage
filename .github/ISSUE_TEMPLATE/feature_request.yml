name: 功能建议
description: 建议新的工具、pipeline、集成或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        如果想法还比较开放，或希望先讨论方向，请前往
        [Discussions → Ideas](https://github.com/calesthio/OpenMontage/discussions/categories/ideas)。
        此表单用于具体、可执行的功能请求。
  - type: textarea
    id: problem
    attributes:
      label: 问题 / 动机
      description: 这个建议要解决什么问题？目前缺少什么？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 请描述你希望增加的工具、pipeline 或具体改动。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 请说明你考虑过的其他实现方式。
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可以提供链接、原型、参考资料或示例。
    validations:
      required: false
