# OpenMontage 全局配置

llm:
  provider: anthropic            # anthropic | openai | gemini | openrouter | ollama | mistral | minimax
  model: null                    # null 表示使用 provider 默认模型
  temperature: 0.7
  max_tokens: 4096

budget:
  mode: warn                     # observe（仅观察）| warn（警告）| cap（硬上限）
  total_usd: 10.00
  reserve_pct: 0.10              # 为重试和收尾保留的预算比例
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # 相对于项目根目录

interaction:
  locale: zh-CN
  content_locale: auto
  provider_prompt_language: auto
  localize_generated_content: true
  preserve_technical_identifiers: true
  preserve_source_language: true

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
